name: GGvGoons
version: '${version}'
main: com.tyler.ggvsgoons.GGvGPlugin
api-version: '1.21'
author: Tyler

commands:
  warprisoner:
    description: Take a player as a war prisoner
    usage: /<command> <player>
    permission: ggvgoons.warprisoner.capture
  warprisoneraccept:
    description: Accept a war prisoner offer (internal)
    usage: /<command> <captorId>
  warprisonerdecline:
    description: Decline a war prisoner offer (internal)
    usage: /<command> <captorId>
  freeprisoner:
    description: Release your war prisoner
    usage: /<command> <player>
    permission: ggvgoons.warprisoner.free
  executeprisoner:
    description: Execute your war prisoner
    usage: /<command> <player>
    permission: ggvgoons.warprisoner.execute
  listprisoners:
    description: List all active war prisoners
    usage: /<command>
    permission: ggvgoons.warprisoner.list
  team:
    description: Team management commands
    usage: /<command> <join|leave|info|list|spawn|setspawn|chat> [args]
    permission: ggvgoons.team.use

permissions:
  ggvgoons.warprisoner.capture:
    description: Allows capturing players as prisoners
    default: op
  ggvgoons.warprisoner.free:
    description: Allows freeing prisoners
    default: op
  ggvgoons.warprisoner.execute:
    description: Allows executing prisoners
    default: op
  ggvgoons.warprisoner.list:
    description: Allows listing all active prisoners
    default: op
  ggvgoons.team.use:
    description: Allows using basic team commands
    default: true
  ggvgoons.team.admin:
    description: Allows using team admin commands (setspawn)
    default: op
  ggvgoons.admin:
    description: Full administrative access to all GGvGoons features
    default: op
    children:
      ggvgoons.warprisoner.capture: true
      ggvgoons.warprisoner.free: true
      ggvgoons.warprisoner.execute: true
      ggvgoons.warprisoner.list: true
      ggvgoons.team.admin: true
